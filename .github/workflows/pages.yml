name: Verify and deploy MAKMA Labs
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Python quality gate
        run: |
          python -m pip install -e ".[dev]"
          python -m ruff check .
          python -m pytest -q
      - name: Install locked browser test dependencies
        run: npm ci --ignore-scripts
      - name: Check shared domain contracts
        run: |
          python scripts/fetch_parity_backends.py
          python scripts/generate_parity.py --backend-root parity-backends --check
          npm test
          node --check demo/app.js
          for file in demo/projects/assets/*.js demo/projects/assets/tools/*.js; do node --check "$file"; done
      - name: Build versioned static site
        run: npm run build
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Product interaction and rejection tests
        run: npm run test:e2e
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
        with:
          enablement: false
      - name: Upload verified site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: dist-site
  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Deploy verified site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
      - name: Verify deployed release and all public URLs
        run: python scripts/verify_live.py
