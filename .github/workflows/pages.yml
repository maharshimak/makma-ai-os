name: Deploy Runtime Console

on:
  push:
    branches: [main]
    paths:
      - "demo/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Validate console assets
        run: |
          test -f demo/index.html
          test -f demo/styles.css
          test -f demo/app.js
          test -f demo/favicon.svg
          test -f demo/projects/index.html
          test -f demo/projects/assets/styles.css
          node --check demo/projects/assets/core.js
          for f in demo/projects/assets/tools/*.js; do node --check "$f"; done
          for page in demo/projects/*/index.html; do test -s "$page"; done

      - name: Smoke-test functional product pages
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"

          check_page() {
            local slug="$1"
            local marker="$2"
            local output
            output="$(mktemp)"
            "$CHROME" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --allow-file-access-from-files \
              --virtual-time-budget=3000 \
              --dump-dom \
              "file://${GITHUB_WORKSPACE}/demo/projects/${slug}/index.html" \
              > "$output" 2>/tmp/makma-chrome.log
            grep -q "$marker" "$output"
            if grep -q "Could not run this workflow" "$output"; then
              echo "Runtime error detected in ${slug}"
              cat "$output"
              exit 1
            fi
          }

          main_output="$(mktemp)"
          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --allow-file-access-from-files \
            --virtual-time-budget=3000 \
            --dump-dom \
            "file://${GITHUB_WORKSPACE}/demo/index.html?smoke=1" \
            > "$main_output" 2>/tmp/makma-main-chrome.log
          grep -q "19 \* 23 = 437" "$main_output"

          check_page agentic-rag-engine "Grounded evidence"
          check_page multimodal-ai-studio "Validated edit plan"
          check_page knowledge-twin "Resolved entity"
          check_page clinical-document-intelligence "Structured record"
          check_page secure-data-copilot "Executed result"
          check_page llm-eval-observability "Reliability confidence"
          check_page mlops-control-plane "Promotion decision"
          check_page mlops-production-pipeline "Held-out predictions"

      - name: Upload console
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: demo

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
