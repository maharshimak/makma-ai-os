name: Python CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Regression tests
        run: python -m pytest -q
      - name: Validate runtime console
        run: |
          node --check demo/app.js
          node --check demo/projects/assets/core.js
          node --check demo/projects/assets/domain.js
          node --check demo/projects/assets/workbench.js
          for f in demo/projects/assets/tools/*.js; do node --check "$f"; done
          test -s demo/index.html
          test -s demo/styles.css
          test -s demo/favicon.svg
          test -s demo/projects/index.html
          test -s demo/projects/assets/styles.css
          test -s demo/projects/agentic-rag-engine/index.html
          test -s demo/projects/multimodal-ai-studio/index.html
          test -s demo/projects/knowledge-twin/index.html
          test -s demo/projects/clinical-document-intelligence/index.html
          test -s demo/projects/secure-data-copilot/index.html
          test -s demo/projects/llm-eval-observability/index.html
          test -s demo/projects/mlops-control-plane/index.html
          test -s demo/projects/mlops-production-pipeline/index.html
      - name: Build distributable wheel
        run: python -m pip wheel --no-deps . -w dist
      - name: Build container
        run: docker build -t portfolio-project:ci .
