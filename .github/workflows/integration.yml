name: Cross-system integration
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    # Workflows A/B/C against the eight specialist packages pinned in backend-lock.json.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install orchestrator
        run: python -m pip install -e ".[dev]"
      - name: Install pinned specialists (fails the job if any is missing)
        run: python scripts/install_specialists.py
      - name: Cross-system workflows
        env:
          MAKMA_INTEGRATION: '1'
        run: python -m pytest -m integration -v -rs
  media:
    # Workflow C full render path with real FFmpeg/FFprobe; skipping is not allowed here.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1
      - name: Install orchestrator and pinned specialists
        run: |
          python -m pip install -e ".[dev]"
          python scripts/install_specialists.py
      - name: Media workflow with real FFmpeg
        env:
          MAKMA_INTEGRATION: '1'
          MAKMA_MEDIA_E2E: '1'
        run: python -m pytest -m media -v -rs
